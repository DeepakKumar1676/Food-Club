spring:
  application:
    name: Food-Club
  datasource:
    url: jdbc:mysql://localhost:3306/food_club_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Manoj@7050
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
